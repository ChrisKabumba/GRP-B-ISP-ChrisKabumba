{% extends "base.html" %}
{% block title %}Profile - MyApp{% endblock %}
{% block content %}
<div class="container py-5 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
                <div class="card p-4 border-0 shadow-sm text-center" style="max-width: 400px; width: 100%;">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                        alt="Profile Picture" class="rounded-circle mb-3 mx-auto" width="100" height="100">
                    <h3 class="text-primary mb-1">{{ current_user.username }}</h3>
                    <p class="text-muted">{{ current_user.email }}</p>
                    <hr>
                    <h5 class="text-primary mb-3">Account Details</h5>
                    <ul class="list-group text-start mb-4">
                    <li class="list-group-item border-0">
                        <strong>Role:</strong> {{ 'Admin' if current_user.role == 'admin' else 'User' }}
                    </li>
                    </ul>

                    <a href="{{ url_for('main.edit_profile') }}" class="btn btn-primary w-75 mb-2">Edit Profile</a>
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary w-75">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
